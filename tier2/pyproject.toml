[project]
name = "maritime-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.52.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
]

[project.scripts]
maritime = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"
